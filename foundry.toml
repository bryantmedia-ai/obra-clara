[profile.default]
src = "contracts/src"
out = "contracts/out"
test = "contracts/test"
libs = []
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "none", path = "./" }]

# Fuji is the only network this escrow is allowed to target.
# No private key, no RPC broadcast and no mainnet endpoint belong here.
[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
